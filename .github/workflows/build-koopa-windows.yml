name: Build Koopa desktop for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koopa-desktop-windows
  cancel-in-progress: true

env:
  CHANNEL: stable
  BUILD_CHANNEL: stable
  RELEASE_CHANNEL: stable
  PUBLIC_RELEASE_CHANNEL: stable
  VERSION: 2026.922.1
  BUILD_VERSION: 2026.922.1
  PUBLIC_BUILD_VERSION: 2026.922.1
  DESKTOP_PLATFORM: windows
  DESKTOP_ARCH: x64
  PLATFORM: windows
  ARCH: x64
  ELECTRON_ARCH: x64

jobs:
  build-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 180

    steps:
      - name: Checkout CI helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: _ci

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source

      - name: Set up Rust for CI helpers
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.98.1"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Ensure python3 command
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step ensure_python3_windows

      - name: Shorten Windows paths and pin pnpm store
        env:
          SUBST_TARGET: ${{ github.workspace }}/source
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step windows_paths

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26

      - name: Set up pnpm
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step setup_pnpm

      - name: Resolve pnpm store path
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step resolve_pnpm_store_windows

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: windows-x64-pnpm-store-${{ hashFiles('source/pnpm-lock.yaml') }}
          restore-keys: windows-x64-pnpm-store-

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9
        with:
          arch: amd64

      - name: Set up Rust Windows target
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step install_rust_windows_targets

      - name: Install dependencies
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step install_dependencies

      - name: Update application version
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step update_version

      - name: Set stable build channel
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step set_build_channel

      - name: Build Electron and native Windows modules
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step build_electron_main

      - name: Verify Koopa URL configuration
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        shell: pwsh
        run: |
          $constants = Get-Content -Raw src/common/Constants.ts
          $expected = @(
            "STABLE_APP_URL = 'https://koopa.ospinh.com'",
            "CANARY_APP_URL = 'https://koopa.ospinh.com'",
            "STATIC_CDN_URL = 'https://koopa.ospinh.com'"
          )
          foreach ($entry in $expected) {
            if (-not $constants.Contains($entry)) {
              throw "Missing expected Koopa URL configuration: $entry"
            }
          }
          foreach ($legacyUrl in @('https://web.fluxer.app', 'https://web.canary.fluxer.app', 'https://fluxerstatic.com')) {
            if ($constants.Contains($legacyUrl)) {
              throw "Legacy URL remains in Constants.ts: $legacyUrl"
            }
          }

      - name: Build unpacked Windows application
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          TEMP: C:\t
          TMP: C:\t
          ELECTRON_BUILDER_CACHE: C:\ebcache
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step build_app_windows

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.x"

      - name: Install Velopack CLI
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step install_velopack_cli

      - name: Create portable ZIP
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step create_portable_zip_windows

      - name: Create unsigned Windows installer
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        shell: pwsh
        run: |
          $app = Get-ChildItem dist-electron -Filter Fluxer.exe -Recurse |
            Where-Object { $_.Directory.Name -like '*unpacked*' } |
            Select-Object -First 1
          if (-not $app) {
            throw 'Unable to locate the unpacked Fluxer.exe.'
          }

          $vpk = Get-ChildItem .velopack -Filter vpk.exe -Recurse | Select-Object -First 1
          if (-not $vpk) {
            throw 'Unable to locate the Velopack CLI.'
          }

          $output = 'dist-electron/velopack-windows-x64'
          New-Item -ItemType Directory -Force $output | Out-Null
          & $vpk.FullName --yes pack `
            --packId fluxer_desktop `
            --packVersion $env:VERSION `
            --packDir $app.Directory.FullName `
            --mainExe Fluxer.exe `
            --packTitle Fluxer `
            --packAuthors 'Fluxer Platform AB' `
            --shortcuts 'Desktop,StartMenu' `
            --runtime win-x64 `
            --icon build_resources/icons-stable/icon.ico `
            --outputDir $output `
            --delta None
          if ($LASTEXITCODE -ne 0) {
            throw "Velopack failed with exit code $LASTEXITCODE."
          }

      - name: Stage artifacts and checksums
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        shell: pwsh
        run: |
          $staging = 'upload_staging'
          New-Item -ItemType Directory -Force $staging | Out-Null

          Copy-Item 'dist-electron/Fluxer-*-portable-win-x64.zip' $staging
          Copy-Item 'dist-electron/velopack-windows-x64/*' $staging

          $setup = Get-ChildItem $staging -Filter '*-Setup.exe' | Select-Object -First 1
          if (-not $setup) {
            throw 'Velopack did not produce a Setup executable.'
          }
          Copy-Item $setup.FullName (Join-Path $staging "Fluxer-$env:VERSION-win-x64.exe")

          Get-ChildItem $staging -File |
            Where-Object { $_.Extension -in @('.exe', '.zip', '.nupkg') } |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              Set-Content -NoNewline -Path "$($_.FullName).sha256" -Value $hash
            }

          Get-ChildItem $staging -File | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fluxer-koopa-windows-x64
          path: ${{ env.WORKDIR }}/fluxer_desktop/upload_staging
          if-no-files-found: error
          retention-days: 7
